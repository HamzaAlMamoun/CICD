name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # praktisch standaard
    runs-on: ubuntu-latest
    steps:
      - name: CodeOphalen
        uses: actions/checkout@v7

      - name: NodeInstall
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Testuitvoeren
        run: npm test
