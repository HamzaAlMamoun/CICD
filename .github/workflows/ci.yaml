name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # praktisch standaard
    runs-on: ubuntu-latest
    #Toegeoevgd in oef 5
    strategy:
      matrix:
        node: [22, 24, 26]
    #TOT HIER
    defaults:
      run:
        working-directory: 019/acme-todo
    steps:
      - name: CodeOphalen
        uses: actions/checkout@v7

      - name: NodeInstall
        uses: actions/setup-node@v7
        with:
          node-version: ${{matrix.node}}
      - name: Testuitvoeren
        run: npm test
